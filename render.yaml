# Render : site statique (Blueprint). Aucune règle de réécriture vers /index.html : /v1/ et /v2/ sont de vraies pages.
services:
  - type: web
    name: fada-lille-demo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      # Démo : ne pas apparaître dans les moteurs de recherche
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
